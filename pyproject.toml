[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-summaries"
version = "0.2.0"
description = "Draft a searchable summary of each meeting transcript with Claude Code, for you to review: quotes checked, questions asked once."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "claude-headless>=0.1",   # the headless run and the usage-limit queue; not on PyPI, see README
    "win-background>=0.2",    # notifications and the log; not on PyPI, see README
]

[project.scripts]
meeting-summaries = "meeting_summaries.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
